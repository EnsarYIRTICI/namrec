# Host'taki nginx: /etc/nginx/sites-available/namrec
#   ln -s /etc/nginx/sites-available/namrec /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#   HTTPS: certbot --nginx -d namrec.xenny.cloud
# .env içindeki APP_ORIGIN bu alan adıyla (https://...) aynı olmalı.

server {
    listen 80;
    server_name namrec.xenny.cloud;

    # Excel içe aktarma satırları JSON olarak gelir (API sınırı 3 MB)
    client_max_body_size 4m;

    # API doğrudan Express'e
    location /api/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # istemcinin gönderdiği başlığı ezer (sahtecilik önlemi)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arayüz Next.js'e
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
